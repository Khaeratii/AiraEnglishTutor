<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aira - History</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="icon" type="image/svg+xml" href="/assets/icon-aira.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body class="dashboard-body">
    <div class="dashboard-container">
      <button
        class="mobile-nav-toggle"
        type="button"
        aria-label="Open navigation"
        aria-expanded="false"
      >
        <i class="fas fa-bars"></i><span>Aira</span>
      </button>
      <div class="sidebar-backdrop"></div>
      <aside class="dashboard-sidebar">
        <div class="sidebar-header">
          <div class="logo">
            <div class="logo-icon"><i class="fas fa-comment-dots"></i></div>
            <h2>Aira</h2>
          </div>
          <button
            class="sidebar-close"
            type="button"
            aria-label="Close navigation"
          >
            <i class="fas fa-times"></i>
          </button>
        </div>
        <nav
          class="sidebar-nav sidebar-primary-nav"
          aria-label="Main navigation"
        >
          <a href="/" class="nav-item"
            ><i class="fas fa-comments"></i><span>Conversation</span></a
          >
          <a href="/analysis" class="nav-item"
            ><i class="fas fa-clipboard-check"></i><span>Analysis</span></a
          >
          <a href="/statistics" class="nav-item"
            ><i class="fas fa-chart-line"></i><span>Statistics</span></a
          >
          <a href="/history" class="nav-item active"
            ><i class="fas fa-history"></i><span>History</span></a
          >
        </nav>
        <nav
          class="sidebar-nav sidebar-secondary-nav"
          aria-label="Account navigation"
        >
          <a href="/profile" class="nav-item"
            ><i class="fas fa-user"></i><span>Profile</span></a
          >
        </nav>
        <div class="sidebar-bottom">
          <button class="btn btn-logout" type="button" data-nav-logout>
            <i class="fas fa-sign-out-alt"></i><span>Sign Out</span>
          </button>
        </div>
      </aside>

      <main class="dashboard-main">
        <header class="dashboard-header">
          <h1>Chat History</h1>
          <p>Your previous conversations with Aira</p>
        </header>
        <div id="historyContent" class="dashboard-content">
          <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading history...</p>
          </div>
        </div>
      </main>
    </div>
    <script src="/js/navigation.js"></script>
    <script src="/js/history.js"></script>
  </body>
</html>
