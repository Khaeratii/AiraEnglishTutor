<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aira - Create Account</title>
    <link rel="stylesheet" href="/css/auth.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/assets/icon-aira.svg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body class="auth-body">
    <div class="aero-bg">
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>
      <div class="bubble bubble-1"></div>
      <div class="bubble bubble-2"></div>
      <div class="bubble bubble-3"></div>
    </div>

    <div class="auth-container">
      <div class="auth-left">
        <div class="brand-content">
          <div class="brand-logo">
            <div class="logo-circle">
              <i class="fas fa-comment-dots"></i>
            </div>
            <h1>Aira</h1>
          </div>
          <p class="brand-tagline">Start your English journey today</p>
          <div class="brand-illustration">
            <div class="illustration-circle">
              <i class="fas fa-rocket"></i>
            </div>
          </div>
          <div class="brand-features">
            <div class="feature-item">
              <i class="fas fa-star"></i>
              <span>Personalized feedback</span>
            </div>
            <div class="feature-item">
              <i class="fas fa-clock"></i>
              <span>Practice anytime</span>
            </div>
            <div class="feature-item">
              <i class="fas fa-trophy"></i>
              <span>Track improvement</span>
            </div>
          </div>
        </div>
      </div>

      <div class="auth-right">
        <div class="auth-card">
          <div class="auth-header">
            <h2>Create Account <span class="wave">✨</span></h2>
            <p>Join Aira and start speaking English</p>
          </div>

          <form id="signupForm" class="auth-form">
            <div class="form-group">
              <label for="name">Full Name</label>
              <div class="input-wrapper">
                <i class="fas fa-user input-icon"></i>
                <input
                  type="text"
                  id="name"
                  placeholder="Your name"
                  required
                  autocomplete="name"
                />
              </div>
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <div class="input-wrapper">
                <i class="fas fa-envelope input-icon"></i>
                <input
                  type="email"
                  id="email"
                  placeholder="you@example.com"
                  required
                  autocomplete="email"
                />
              </div>
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input
                  type="password"
                  id="password"
                  placeholder="Min 6 characters"
                  required
                  autocomplete="new-password"
                />
              </div>
            </div>

            <div class="form-group">
              <label for="confirm">Confirm Password</label>
              <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input
                  type="password"
                  id="confirm"
                  placeholder="Re-enter password"
                  required
                  autocomplete="new-password"
                />
              </div>
            </div>

            <button
              type="submit"
              class="btn btn-primary btn-full"
              id="signupBtn"
            >
              <span class="btn-text">Create Account</span>
              <span class="btn-loading" style="display: none">
                <i class="fas fa-spinner fa-spin"></i> Creating...
              </span>
            </button>

            <div id="errorMessage" class="error-message"></div>
          </form>

          <div class="auth-footer">
            <p>Already have an account? <a href="/login">Sign in</a></p>
          </div>
        </div>
      </div>
    </div>

    <script src="/js/auth.js"></script>
  </body>
</html>
