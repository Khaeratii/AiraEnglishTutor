<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aira - Reset Password</title>
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body class="auth-body">
    <div class="auth-container">
      <div class="auth-left">
        <div class="brand-content">
          <div class="brand-logo">
            <div class="logo-circle"><i class="fas fa-comment-dots"></i></div>
            <h1>Aira</h1>
          </div>
          <p class="brand-tagline">Your AI English Conversation Partner</p>
        </div>
      </div>
      <div class="auth-right">
        <div class="auth-card">
          <div class="auth-header">
            <h2>Choose a new password</h2>
            <p>Use at least 6 characters.</p>
          </div>
          <form id="resetForm" class="auth-form">
            <div class="form-group">
              <label for="password">New Password</label>
              <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i
                ><input
                  id="password"
                  type="password"
                  required
                  autocomplete="new-password"
                />
              </div>
            </div>
            <div class="form-group">
              <label for="confirm">Confirm New Password</label>
              <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i
                ><input
                  id="confirm"
                  type="password"
                  required
                  autocomplete="new-password"
                />
              </div>
            </div>
            <button
              id="resetBtn"
              class="btn btn-primary btn-full"
              type="submit"
            >
              <span class="btn-text">Reset Password</span
              ><span class="btn-loading" style="display: none"
                ><i class="fas fa-spinner fa-spin"></i> Resetting...</span
              >
            </button>
            <div id="errorMessage" class="error-message"></div>
          </form>
          <div class="auth-footer">
            <p><a href="/login">Back to Login</a></p>
          </div>
        </div>
      </div>
    </div>
    <script src="/js/auth.js"></script>
    <script src="/js/password-reset.js"></script>
  </body>
</html>
