<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aira - Sign In</title>
    <link rel="stylesheet" href="/css/auth.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/assets/icon-aira.svg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body class="auth-body">
    <!-- Background Elements -->
    <div class="aero-bg">
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>
      <div class="bubble bubble-1"></div>
      <div class="bubble bubble-2"></div>
      <div class="bubble bubble-3"></div>
    </div>

    <div class="auth-container">
      <!-- LEFT SIDE - Branding -->
      <div class="auth-left">
        <div class="brand-content">
          <div class="brand-logo">
            <div class="logo-circle">
              <i class="fas fa-comment-dots"></i>
            </div>
            <h1>Aira</h1>
          </div>
          <p class="brand-tagline">Your AI English Conversation Partner</p>
          <div class="brand-illustration">
            <div class="illustration-circle">
              <i class="fas fa-graduation-cap"></i>
            </div>
          </div>
          <div class="brand-features">
            <div class="feature-item">
              <i class="fas fa-microphone"></i>
              <span>Practice speaking naturally</span>
            </div>
            <div class="feature-item">
              <i class="fas fa-chart-line"></i>
              <span>Track your progress</span>
            </div>
            <div class="feature-item">
              <i class="fas fa-comments"></i>
              <span>Real conversations</span>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT SIDE - Login Form -->
      <div class="auth-right">
        <div class="auth-card">
          <div class="auth-header">
            <h2>Welcome back! <span class="wave">👋</span></h2>
            <p>Ready to practice your English?</p>
          </div>

          <form id="loginForm" class="auth-form">
            <div class="form-group">
              <label for="email">Email</label>
              <div class="input-wrapper">
                <i class="fas fa-envelope input-icon"></i>
                <input
                  type="email"
                  id="email"
                  placeholder="you@example.com"
                  required
                  autocomplete="email"
                />
              </div>
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input
                  type="password"
                  id="password"
                  placeholder="Enter your password"
                  required
                  autocomplete="current-password"
                />
                <button
                  type="button"
                  class="toggle-password"
                  onclick="togglePassword()"
                >
                  <i class="fas fa-eye" id="toggleIcon"></i>
                </button>
              </div>
            </div>

            <div class="form-options">
              <label class="checkbox-label">
                <input type="checkbox" id="rememberMe" />
                <span>Remember me</span>
              </label>
              <a href="/forgot-password" class="forgot-link"
                >Forgot password?</a
              >
            </div>

            <button
              type="submit"
              class="btn btn-primary btn-full"
              id="loginBtn"
            >
              <span class="btn-text">Sign In</span>
              <span class="btn-loading" style="display: none">
                <i class="fas fa-spinner fa-spin"></i> Signing in...
              </span>
            </button>

            <div id="errorMessage" class="error-message"></div>
          </form>

          <div class="auth-footer">
            <p>Don't have an account? <a href="/signup">Create one</a></p>
          </div>
        </div>
      </div>
    </div>

    <script>
      function togglePassword() {
        const passwordInput = document.getElementById("password");
        const toggleIcon = document.getElementById("toggleIcon");

        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          toggleIcon.classList.remove("fa-eye");
          toggleIcon.classList.add("fa-eye-slash");
        } else {
          passwordInput.type = "password";
          toggleIcon.classList.remove("fa-eye-slash");
          toggleIcon.classList.add("fa-eye");
        }
      }
    </script>
    <script src="/js/auth.js"></script>
  </body>
</html>
